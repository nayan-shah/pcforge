name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (client)
        run: npx -w client tsc --noEmit

      - name: Build (client)
        run: npm run build --workspace=client
        env:
          VITE_API_URL: http://localhost:5000/api/v1

      # No test step — no test scripts exist in any workspace yet.
      # When tests are added, uncomment:
      # - name: Test
      #   run: npm test
